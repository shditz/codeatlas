name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build monorepo
        run: pnpm build

      - name: Build Webview for VS Code
        run: cd apps/webview && pnpm run build

      - name: Package VS Code Extension
        run: |
          mkdir -p apps/vscode-extension/webview/dist
          cp -r apps/webview/dist/* apps/vscode-extension/webview/dist/ 2>/dev/null || true
          cd apps/vscode-extension
          npx --yes @vscode/vsce package --no-dependencies -o ../../codeatlas-vscode.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: codeatlas-vscode.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
