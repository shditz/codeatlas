name: Publish & Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release Packages & Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Tests & Build
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Create Release Pull Request or Publish to NPM
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Package VS Code Extension (.vsix)
        run: |
          cd apps/vscode-extension
          npx --yes @vscode/vsce package --no-dependencies -o ../../codeatlas-vscode.vsix

      - name: Upload VS Code Extension (.vsix) to GitHub Releases
        run: |
          # Upload vsix to the primary/initial release or newly created tags
          gh release upload v0.1.0 codeatlas-vscode.vsix --clobber || true
          for tag in $(git tag --points-at HEAD); do
            gh release upload "$tag" codeatlas-vscode.vsix --clobber || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: steps.changesets.outputs.published == 'true' && env.VSCE_PAT != ''
        run: |
          cd apps/vscode-extension
          npx --yes @vscode/vsce publish --pat ${{ secrets.VSCE_PAT }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
